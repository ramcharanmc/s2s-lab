# FT-1: Moshi LoRA on DailyTalk (test fold removed). moshi-finetune's example/moshi_7B.yaml at the
# pinned commit, with only these changes: the data and run paths, checkpoints every 100 steps (a
# failed machine loses at most 100 steps), and resume_from (s2s-lab's patch; null on a fresh start).
# Placeholders are filled by ft1_prep.py config.

data:
  eval_data: ''
  shuffle: true
  train_data: '{TRAIN_DATA}'

moshi_paths:
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"

full_finetuning: false
lora:
  enable: true
  rank: 128
  scaling: 2.
  ft_embed: false

first_codebook_weight_multiplier: 100.
text_padding_weight: .5

duration_sec: 100
batch_size: 16
max_steps: 2000
gradient_checkpointing: true
optim:
  lr: 2e-6
  weight_decay: 0.1
  pct_start: 0.05

seed: {SEED}
log_freq: 1
eval_freq: 100
do_eval: false
do_ckpt: true
ckpt_freq: 100
num_ckpt_keep: 3

save_adapters: true

run_dir: '{RUN_DIR}'
resume_from: {RESUME_FROM}
