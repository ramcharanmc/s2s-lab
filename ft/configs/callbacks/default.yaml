defaults:
  - model_checkpoint
  - model_summary
  - rich_progress_bar
  - _self_

# No early stopping, and every checkpoint kept (FT-1's lesson: the run that kept three could not
# show what the model was at step 500). Each .ckpt holds the adapter only, a few MB.
model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "step_{step:06d}"
  monitor: "val/wer_raw"
  mode: "min"
  save_top_k: -1
  save_last: True
  save_weights_only: True
  auto_insert_metric_name: False

model_summary:
  max_depth: 1
