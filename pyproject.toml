[project]
name = "s2slab"
version = "0.1.0"
requires-python = ">=3.10"
# Deliberately no dependency list: each track pins its own in requirements/ (base, r0, data, ...).
# The metadata below exists so that ft/ (the fine-tunes, their own uv project) can depend on this
# package by path: `s2slab = { path = "..", editable = true }`.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: loads real models, minutes on a CPU. Run with: python -m pytest -m slow"]
addopts = "-m 'not slow'"
