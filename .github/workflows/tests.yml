# The whole test suite on a fresh machine (M42). The slow tests, which load real models, stay out
# (pyproject.toml: -m 'not slow'); the tests whose audio is not in git skip. ft/'s own suite (NeMo) is not run here.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: torch, the CPU build (requirements/r0.txt says why)
        run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: everything else the suite imports
        run: pip install -r requirements/test.txt
      - name: the suite
        run: python -m pytest tests -q
