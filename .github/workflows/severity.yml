# The severity monotonicity test (v1 §4 and §10's badge, M42): page 09's PHQ-9 and YMRS mapping rendered onto a
# synthetic voice, every feature moving the right way at every step, with requirements/base.txt alone.
name: severity monotonicity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  severity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5          # v5 and v6 run on Node.js 24 (v4 and v5 warned: Node 20 is deprecated)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - run: pip install -r requirements/base.txt
      - name: the severity tests, the monotonicity test among them
        run: python -m pytest tests/test_severity.py -q
